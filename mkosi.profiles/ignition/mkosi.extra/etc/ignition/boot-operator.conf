# boot-operator HTTP base URL.
#
# boot-operator serves each server's ignition config at
#   ${BOOT_OPERATOR_BASE_URL}/ignition/<system-uuid>
# where <system-uuid> is the server's SMBIOS product UUID
# (/sys/class/dmi/id/product_uuid).
#
# This is the LoadBalancer VIP of the boot-operator-service in the
# boot-operator-system namespace (port 8083). Find/update it with:
#   kubectl -n boot-operator-system get svc boot-operator-service
#
# If boot-operator gets a stable DNS name (e.g. via external-dns), swap the
# address below for that name, e.g.:
#   BOOT_OPERATOR_BASE_URL="http://boot-operator.ironcore.dev:8083"
# IPv6 literals keep their brackets; DNS names don't need them.
BOOT_OPERATOR_BASE_URL="http://[2a10:afc0:e016:3201::1:efac]:8083"
