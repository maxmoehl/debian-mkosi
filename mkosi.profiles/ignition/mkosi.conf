[Content]
Packages=
    ca-certificates
    curl
    dmidecode
    jq

# Boot-operator HTTP server that serves /ignition/<system-uuid>. The address is
# the LoadBalancer VIP of the boot-operator-service (see `kubectl -n
# boot-operator-system get svc boot-operator-service`).
#
# Configs are matched by the server's SMBIOS product UUID, fetched at boot
# from /sys/class/dmi/id/product_uuid.
