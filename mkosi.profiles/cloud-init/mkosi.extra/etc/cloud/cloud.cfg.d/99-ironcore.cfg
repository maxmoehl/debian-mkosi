# Register the out-of-tree IronCore datasource (installed alongside this
# file in /usr/lib/python3/dist-packages/ironcore_cloudinit) and restrict
# cloud-init to it. The explicit single-entry list also makes ds-identify
# enable cloud-init unconditionally.
datasource_pkg_list: [ ironcore_cloudinit.sources ]
datasource_list: [ IronCore, None ]

# Networking is managed by systemd-networkd (99-default.network).
network:
  config: disabled

# Do not create the distribution's default user; users are expected to
# come from user-data.
users: []
