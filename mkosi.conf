[Output]
ManifestFormat=json

[Content]
# Set a root password to allow logging in via the console in case something goes
# wrong during the initrd or install phase.
#RootPassword=

WithRecommends=no
Packages=
    # base system
    ?priority(required)
    systemd
    systemd-resolved
    # login and similar necessities
    libnss-systemd
    libpam-systemd
    # tooling
    ca-certificates
    curl
    dmidecode
    ethtool
    iproute2
    jq
    less
    lsof
    man
    mtr-tiny
    net-tools
    openssh-server
    procps
    sudo
    tcpdump
    vim
    xz-utils

# Configure OS to skip any setup prompts.
Hostname=localhost
Keymap=us
Locale=C.UTF-8
Timezone=UTC

# Drop unnecessary files to reduce image size.
RemoveFiles=
    /usr/share/doc/*
    /usr/share/info/*
    /usr/share/locale/*
    /var/cache/apt/*
    /var/lib/apt/lists/*
    /var/log/journal/*
